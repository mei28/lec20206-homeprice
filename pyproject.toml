[project]
name = "kgl"
version = "0.1.0"
description = "waggle: Kaggle competition template. One experiment per script, shared modules in kgl"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "catboost",
    "tyro",
    "psutil",
    "optuna>=5.0.0",
    "xgboost-cu12>=3.4.1",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "marimo",
    "nbformat",
    "kaggle",
    "matplotlib>=3.11.2",
]
dl = [
    "torch",
    "torchvision",
    "timm",
]
track = [
    "wandb",
    "mlflow",
]
# S13: TabNet and TabPFN on the GPU
tabular_dl = [
    "torch",
    "pytorch-tabnet",
    "tabpfn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgl"]

[tool.uv]
package = true
default-groups = ["dev", "tabular_dl"]

# The GPU driver here (555, CUDA 12.5) runs CUDA 12.x builds; PyPI's default torch wheels target newer CUDA.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kgl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff.lint.per-file-ignores]
# Notebook cells hold Japanese prose (a soft line break inside a Japanese sentence renders as a space),
# and marimo displays a cell's last bare expression, which B018 would flag.
"notebooks/*.py" = ["E501", "B018"]
