[project]
name = "kgl"
version = "0.1.0"
description = "waggle: Kaggle competition template. One experiment per script, shared modules in kgl"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "scikit-learn",
    "lightgbm",
    "xgboost",
    "catboost",
    "tyro",
    "psutil",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "marimo",
    "nbformat",
    "kaggle",
    "matplotlib>=3.11.2",
]
dl = [
    "torch",
    "torchvision",
    "timm",
]
track = [
    "wandb",
    "mlflow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kgl"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["kgl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
